<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="600" height="260" style="background:#FAFAFA"><text x="300.0" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C3E50" font-family="system-ui,sans-serif">Arancin<tspan fill="#E8700A">o</tspan> vs Arancin<tspan fill="#4A90D9">a</tspan> — The Great Sicilian Debate</text><text x="300.0" y="42" text-anchor="middle" font-size="10" fill="#7F8C8D" font-family="system-ui,sans-serif">Both are the same thing: a fried rice ball filled with ragù or cheese. The name is the war.</text><rect x="10.0" y="54" width="280.0" height="192" fill="#E8700A" rx="8" opacity="0.08"/><text x="150.0" y="78" text-anchor="middle" font-size="24" font-weight="bold" fill="#E8700A" font-family="system-ui,sans-serif">Arancino</text><text x="150.0" y="96" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2C3E50" font-family="system-ui,sans-serif">Catania + eastern Sicily</text><path d="M130.0,160 L170.0,160 L150.0,192Z" fill="#E8700A" opacity="0.4"/><text x="150.0" y="182.0" text-anchor="middle" font-size="8" fill="#E8700A" font-family="system-ui,sans-serif">cone ▲</text><text x="150.0" y="216" text-anchor="middle" font-size="9" fill="#7F8C8D" font-family="system-ui,sans-serif">Una palla · masc. noun</text><text x="150.0" y="229" text-anchor="middle" font-size="9" fill="#7F8C8D" font-family="system-ui,sans-serif">(it's ball-shaped)</text><rect x="310.0" y="54" width="280.0" height="192" fill="#4A90D9" rx="8" opacity="0.08"/><text x="450.0" y="78" text-anchor="middle" font-size="24" font-weight="bold" fill="#4A90D9" font-family="system-ui,sans-serif">Arancina</text><text x="450.0" y="96" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2C3E50" font-family="system-ui,sans-serif">Palermo + western Sicily</text><circle cx="450.0" cy="172.0" r="20" fill="#4A90D9" opacity="0.4"/><text x="450.0" y="175.0" text-anchor="middle" font-size="8" fill="#4A90D9" font-family="system-ui,sans-serif">round ●</text><text x="450.0" y="216" text-anchor="middle" font-size="9" fill="#7F8C8D" font-family="system-ui,sans-serif">La palla · fem. noun</text><text x="450.0" y="229" text-anchor="middle" font-size="9" fill="#7F8C8D" font-family="system-ui,sans-serif">(orange = arancia, fem.)</text><text x="300.0" y="252" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2C3E50" font-family="system-ui,sans-serif">In Catania: say "arancino" or risk mild judgement. Both taste identical. Order confidently.</text><text x="300.0" y="78" text-anchor="middle" font-size="18" font-weight="bold" fill="#2C3E50" font-family="system-ui,sans-serif" opacity="0.2">vs</text></svg>