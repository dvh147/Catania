<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" style="background:#FAFAFA"><text x="320.0" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C3E50" font-family="system-ui,sans-serif">The Markets of Catania</text><rect x="6.0" y="36" width="308.0" height="24" fill="#4A90D9" rx="4" opacity="0.85"/><text x="160.0" y="53" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF" font-family="system-ui,sans-serif">La Pescheria</text><text x="10.0" y="72" font-size="8.5" font-weight="bold" fill="#4A90D9" font-family="system-ui,sans-serif">Hours</text><text x="10.0" y="82" font-size="8.5" fill="#2C3E50" font-family="system-ui,sans-serif">Mon–Sat  6am–2pm</text><text x="10.0" y="98" font-size="8.5" font-weight="bold" fill="#4A90D9" font-family="system-ui,sans-serif">Best at</text><text x="10.0" y="108" font-size="8.5" fill="#2C3E50" font-family="system-ui,sans-serif">7–9am (busiest, best fish)</text><text x="10.0" y="124" font-size="8.5" font-weight="bold" fill="#4A90D9" font-family="system-ui,sans-serif">Buy</text><text x="10.0" y="134" font-size="8.5" fill="#2C3E50" font-family="system-ui,sans-serif">Fresh fish · sea urchin · clams</text><text x="10.0" y="145" font-size="8.5" fill="#2C3E50" font-family="system-ui,sans-serif">Octopus · swordfish · tuna</text><text x="10.0" y="161" font-size="8.5" font-weight="bold" fill="#4A90D9" font-family="system-ui,sans-serif">Eat</text><text x="10.0" y="171" font-size="8.5" fill="#2C3E50" font-family="system-ui,sans-serif">Boiled octopus · fried stall food</text><text x="10.0" y="182" font-size="8.5" fill="#2C3E50" font-family="system-ui,sans-serif">Street vendors at the edges</text><text x="10.0" y="198" font-size="8.5" font-weight="bold" fill="#4A90D9" font-family="system-ui,sans-serif">Stroller</text><text x="10.0" y="208" font-size="8.5" fill="#2C3E50" font-family="system-ui,sans-serif">★★★☆ Narrow in centre · carrier best</text><text x="10.0" y="224" font-size="8.5" font-weight="bold" fill="#4A90D9" font-family="system-ui,sans-serif">Tip</text><text x="10.0" y="234" font-size="8.5" fill="#2C3E50" font-family="system-ui,sans-serif">Arrive before 8am. The middle</text><text x="10.0" y="245" font-size="8.5" fill="#2C3E50" font-family="system-ui,sans-serif">of the market is for professionals.</text><rect x="326.0" y="36" width="308.0" height="24" fill="#E8700A" rx="4" opacity="0.85"/><text x="480.0" y="53" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF" font-family="system-ui,sans-serif">Mercato di Via Plebiscito</text><text x="330.0" y="72" font-size="8.5" font-weight="bold" fill="#E8700A" font-family="system-ui,sans-serif">Hours</text><text x="330.0" y="82" font-size="8.5" fill="#2C3E50" font-family="system-ui,sans-serif">Mon–Sat  7am–2pm</text><text x="330.0" y="98" font-size="8.5" font-weight="bold" fill="#E8700A" font-family="system-ui,sans-serif">Best at</text><text x="330.0" y="108" font-size="8.5" fill="#2C3E50" font-family="system-ui,sans-serif">9–11am (quieter, more relaxed)</text><text x="330.0" y="124" font-size="8.5" font-weight="bold" fill="#E8700A" font-family="system-ui,sans-serif">Buy</text><text x="330.0" y="134" font-size="8.5" fill="#2C3E50" font-family="system-ui,sans-serif">Fruit · veg · herbs · spices</text><text x="330.0" y="145" font-size="8.5" fill="#2C3E50" font-family="system-ui,sans-serif">Blood oranges · lemons · capers</text><text x="330.0" y="161" font-size="8.5" font-weight="bold" fill="#E8700A" font-family="system-ui,sans-serif">Eat</text><text x="330.0" y="171" font-size="8.5" fill="#2C3E50" font-family="system-ui,sans-serif">Less food at stalls — eat</text><text x="330.0" y="182" font-size="8.5" fill="#2C3E50" font-family="system-ui,sans-serif">before or after at nearby bars</text><text x="330.0" y="198" font-size="8.5" font-weight="bold" fill="#E8700A" font-family="system-ui,sans-serif">Stroller</text><text x="330.0" y="208" font-size="8.5" fill="#2C3E50" font-family="system-ui,sans-serif">★★★★ Wider aisles, more manageable</text><text x="330.0" y="224" font-size="8.5" font-weight="bold" fill="#E8700A" font-family="system-ui,sans-serif">Tip</text><text x="330.0" y="234" font-size="8.5" fill="#2C3E50" font-family="system-ui,sans-serif">Buy blood oranges in bulk here.</text><text x="330.0" y="245" font-size="8.5" fill="#2C3E50" font-family="system-ui,sans-serif">Cheaper than tourist spots.</text><line x1="320.0" y1="36" x2="320.0" y2="300" stroke="#ECF0F1" stroke-width="2"/></svg>