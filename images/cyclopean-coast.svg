<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" style="background:#FAFAFA"><text x="320.0" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C3E50" font-family="system-ui,sans-serif">The Cyclopean Coast — What to Do Where</text><line x1="60.0" y1="80" x2="200.0" y2="80" stroke="#ECF0F1" stroke-width="3"/><circle cx="60.0" cy="80" r="7" fill="#2C3E50" opacity="0.9"/><circle cx="60.0" cy="80" r="7" fill="none" stroke="#2C3E50" stroke-width="1.5"/><text x="60.0" y="105" text-anchor="middle" font-size="10" font-weight="bold" fill="#2C3E50" font-family="system-ui,sans-serif">Catania</text><text x="60.0" y="120" text-anchor="middle" font-size="8.5" fill="#7F8C8D" font-family="system-ui,sans-serif">Your base — 20 min drive north</text><line x1="200.0" y1="80" x2="340.0" y2="80" stroke="#ECF0F1" stroke-width="3"/><circle cx="200.0" cy="80" r="10" fill="#4A90D9" opacity="0.9"/><text x="200.0" y="105" text-anchor="middle" font-size="10" font-weight="bold" fill="#4A90D9" font-family="system-ui,sans-serif">Aci Castello</text><text x="200.0" y="120" text-anchor="middle" font-size="8.5" fill="#2C3E50" font-family="system-ui,sans-serif">Norman castle on basalt rock over sea</text><text x="200.0" y="133" text-anchor="middle" font-size="8.5" fill="#2C3E50" font-family="system-ui,sans-serif">Any weather · 15 min from Catania</text><line x1="340.0" y1="80" x2="480.0" y2="80" stroke="#ECF0F1" stroke-width="3"/><circle cx="340.0" cy="80" r="10" fill="#E8700A" opacity="0.9"/><text x="340.0" y="105" text-anchor="middle" font-size="10" font-weight="bold" fill="#E8700A" font-family="system-ui,sans-serif">Aci Trezza</text><text x="340.0" y="120" text-anchor="middle" font-size="8.5" fill="#2C3E50" font-family="system-ui,sans-serif">The Faraglioni sea stacks</text><text x="340.0" y="133" text-anchor="middle" font-size="8.5" fill="#2C3E50" font-family="system-ui,sans-serif">Harbour, fish lunch, waterfront walk</text><line x1="480.0" y1="80" x2="620.0" y2="80" stroke="#ECF0F1" stroke-width="3"/><circle cx="480.0" cy="80" r="10" fill="#8E44AD" opacity="0.9"/><text x="480.0" y="105" text-anchor="middle" font-size="10" font-weight="bold" fill="#8E44AD" font-family="system-ui,sans-serif">Acireale</text><text x="480.0" y="120" text-anchor="middle" font-size="8.5" fill="#2C3E50" font-family="system-ui,sans-serif">Baroque clifftop city · good pasticcerie</text><text x="480.0" y="133" text-anchor="middle" font-size="8.5" fill="#2C3E50" font-family="system-ui,sans-serif">Rainy day alternative to beach</text><circle cx="620.0" cy="80" r="7" fill="#7F8C8D" opacity="0.9"/><circle cx="620.0" cy="80" r="7" fill="none" stroke="#7F8C8D" stroke-width="1.5"/><text x="620.0" y="105" text-anchor="middle" font-size="10" font-weight="bold" fill="#7F8C8D" font-family="system-ui,sans-serif">Taormina</text><text x="620.0" y="120" text-anchor="middle" font-size="8.5" fill="#7F8C8D" font-family="system-ui,sans-serif">50 min north by A18</text><text x="620.0" y="133" text-anchor="middle" font-size="8.5" fill="#7F8C8D" font-family="system-ui,sans-serif">Separate day trip — not part of coast day</text><text x="320.0" y="272" text-anchor="middle" font-size="9" fill="#7F8C8D" font-family="system-ui,sans-serif">Drive north along the SP59 coastal road · no motorway needed · Aci Trezza and Aci Castello are 10 min apart</text></svg>